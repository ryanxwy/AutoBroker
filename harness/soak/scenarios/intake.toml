# --- ask_branches -------------------------------------------------------------
# The profile-ASK 0/1/2 three-branch, exercised through a DOWNSTREAM
# /dealer_geosearch in the same pinned session (intake itself is resolver-exempt):
# 0 active → STOP intake CTA; 1 active → inferred_newest run; 2+ active → STOP
# picker by vehicle name. The picker pick is the gate verb.
[[scenarios]]
id = "intake_ask_branches"
surface = "search_profile_intake"
class_name = "intake_ask_branches"
stresses = "profile-ASK three-branch (invariant #6) through a downstream /dealer_geosearch in-session: 0 active → STOP intake CTA, 1 → inferred_newest run, 2+ → STOP picker by vehicle name."
buyer_model = "opus"
dealer_needed = false
deterministic_assertions = ["intake_ask_0_stop_intake", "intake_ask_1_run", "intake_ask_2_stop_pick", "no_external_mutation", "l1_fuse_armed"]
judge_dims = []
gate_verbs = ["profile_stop_pick", "profile_stop_intake_cta"]

# --- freeform_while_suspended (FIXED behavior) --------------------------------
# The session-consistency hazard, now FIXED by the router (commit 8863d11):
# ChatInput is DISABLED while a gate is pending, so a second freeform typed while
# the intake form is suspended is REFUSED at the component — NO rogue second
# intake forks. This scenario asserts the FIXED behavior (exactly ONE intake run
# in the session), not the old bug.
[[scenarios]]
id = "intake_freeform_while_suspended"
surface = "search_profile_intake"
class_name = "intake_freeform_while_suspended"
stresses = "FIXED session-consistency (commit 8863d11): the chat rail is disabled while the intake form is suspended, so a second freeform forks NO rogue intake — exactly one intake run in the pinned session."
buyer_model = "opus"
dealer_needed = false
deterministic_assertions = ["intake_single_new_profile", "intake_prefill_never_persists", "no_external_mutation", "l1_fuse_armed"]
judge_dims = []
gate_verbs = []
