[[scenarios]]
id = "full_e2e_journey"
surface = "quote_pipeline"
class_name = "full_e2e_journey"
stresses = "intake -> geosearch -> site_scan -> inbox_check -> quote_pipeline -> lead_submit -> negotiation_followup as one pinned session; the 7 memory<->workflow consistency invariants end-to-end."
buyer_model = "opus"
dealer_needed = true
deterministic_assertions = ["no_external_mutation", "test_mode_armed", "irreversible_fake_send", "cost_and_time_attributable"]
judge_dims = ["buyer_coherence", "extraction_quality", "dealer_realism"]
gate_verbs = ["batch_submit", "inbox_submit", "approval_approve"]
