stresses = "the buyer reaches the batch_review card and clicks Decline: terminal 'declined' outcome, ZERO sends, ZERO messages rows, ZERO threads rows, dealer_contacts unchanged, keystone clean (the X2 Δ0 twin) — proves the gate renders BEFORE any send face (per-skill decline_zero_write + no_flip_default)."
