[[scenarios]]
id = "negfu_contact_flip_mid_thread"
surface = "negotiation_followup"
class_name = "contact_flip_mid_thread"
stresses = "the contact-flip SECOND suspend: the batch approve carrying flip_* fields registers the override (requestContactFlipForRun); a SEPARATE sensitive re-confirm (reason=contact_flip, sensitive=true) MUST render and be answered by a distinct button BEFORE setPrimaryReplyTarget commits; decline-at-second = no flip but the send still proceeds; the default happy path NEVER flips (per-skill: contact_flip_2nd_suspend + reply_double_flag)."
buyer_model = "opus"
