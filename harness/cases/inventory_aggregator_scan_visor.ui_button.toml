# harness/cases/inventory_aggregator_scan_visor.ui_button.toml — the aggregator
# (shopping-site) scan launched from the SKILLS POPOVER RUN BUTTON in a fresh
# UNPINNED world, UI-LANE, ONE browser session end-to-end:
#
#   step 1  intake via chat-rail SLASH (the corpus Tucson profile) — the scan's
#           input. The profile's location lands its postal_code, which is the
#           ONLY location the aggregator SRP URLs need (no dealer set).
#   step 2  inventory_aggregator_scan from the TopBar Skills popover's real Run
#           button (the second user surface; the popover refetches on every open
#           so the just-created profile enables the row). NO pin on the session →
#           no search_profile_id on the start body → the scan's resolver infers
#           newest-active (resolution=inferred_newest). The read-only scan builds
#           each shopping site's public search URL from the profile slice, reads
#           the first results page, extracts matching in-stock listings, and
#           writes them profile-scoped — no dealer approval gate, no dealer set.
#
# NO dealer_geosearch step: this skill needs no discovered dealer set; the
# profile's postal_code alone drives every aggregator SRP URL. dealer rows are
# resolved/minted from the listing tiles inside the scan itself.
#
# cost_and_time is REQUIRED on step 2 (extraction is an LLM phase — no optional
# key). max_seconds = 1800 is PER-STEP (scan only); CLI overrides. RADIUS 120
# (live default) widens the shopping-site search to dozens of SoCal listings.
#
# This case is the PER-SITE-CONTRIBUTION acceptance for the visor round: it needs
# a one-time human Turnstile pass in the aggregator/visor_vin persistent profile
# (headed window, 120s wait) and is judged over 3 spaced live runs; the base
# inventory_aggregator_scan case above stays the standing politeness-budget case.
#
# NOT in regression-corpus.txt: like inventory_site_scan.ui_button, this live
# shopping-site round is accepted-but-rotated (one shopping-site pass per run is
# the politeness budget).

[meta]
id = "inventory_aggregator_scan_visor"
archetype = "A"
skills = ["search_profile_intake", "inventory_aggregator_scan"]
risk_group = "E"

[narrative]
session_origin = "fresh_unpinned"
input_mode = "slash"
provider = "deepseek"
lane = "ui"

[narrative.profile]
make = "Hyundai"
model = "Tucson Hybrid"
year = 2026
location_query = "Irvine, CA 92614"
follow_up_email = "livetest@example.com"
financing_preference = "finance"
trim = "Limited"
search_radius_miles = 120
budget_max = 0
follow_up_phone = "949-555-0100"
phone_policy = "fake"
preferred_exterior_colors_json = null
preferred_interior_colors_json = null
acceptable_trims_json = null
feature_preferences_json = null
trade_in_description = null
military_first_responder = 0
current_brand_owner = 0

# ---- step 1: intake (the journey root) --------------------------------------

[[steps]]
id = "intake_create"
skill = "search_profile_intake"
purpose = "Create the Tucson profile through the real dashboard — the scan's input."
gate_policy = "approve_safe"
launch = "chat_slash"

[[steps.resume]]
on = "data_collection"
action = "accept"
content_from = "narrative.profile"

[[steps.resume]]
on = "intake_confirm"
action = "accept"

[[steps.anchors]]
kind = "run_status"
expect = ["done"]

[[steps.anchors]]
kind = "driver_kind"
expect = "deepseek_apikey"

[[steps.anchors]]
kind = "table_min_rows"
table = "search_profiles"
scope = "profile"
delta_min = 1

[[steps.anchors]]
kind = "no_external_mutation"

# ---- step 2: inventory_aggregator_scan from the Skills popover Run button ------

[[steps]]
id = "scan_button"
skill = "inventory_aggregator_scan"
purpose = "Launch the shopping-site scan from the popover Run button; build SRP URLs from the profile slice; scan real shopping sites."
gate_policy = "approve_safe"
launch = "skills_popover"
max_seconds = 1800          # PER-STEP budget: full shopping-site capture+extract.

[[steps.anchors]]
kind = "run_status"
expect = ["done"]

[[steps.anchors]]
kind = "driver_kind"
expect = "deepseek_apikey"

[[steps.anchors]]
kind = "browser_activity"

[[steps.anchors]]
kind = "table_min_rows"
table = "inventory_listings"
scope = "profile"
delta_min = 1

[[steps.anchors]]
kind = "no_external_mutation"

[[steps.anchors]]
kind = "cost_and_time"      # REQUIRED — extraction is an LLM phase.

[[steps.anchors]]
kind = "resolution"
expect = "inferred_newest"  # unpinned session + single active profile.

[[steps.anchors]]
kind = "site_contribution"
site = "cars_com"
min_listings = 1

[[steps.anchors]]
kind = "site_contribution"
site = "visor_vin"
min_listings = 1
