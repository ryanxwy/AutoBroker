# harness/cases/inventory_site_scan.ui_decline.toml — the batch_review DECLINE
# twin, UI-LANE, ONE browser session end-to-end. The card suspends BEFORE any
# dealer-site contact, so this case is safe to run live: the decline must be
# terminal with ZERO inventory writes and ZERO browser navigation on the scan
# run (the batchReview suspend precedes every Browser launch by construction).
#
#   step 1  intake via chat-rail SLASH (the corpus Tucson profile).
#   step 2  "/dealer_geosearch" via slash — the scan needs discovered dealers
#           for the batch card to have rows (real Maps browsing, local upsert).
#   step 3  "/inventory_site_scan" via slash → the batch_review card renders on
#           the gate-banner track → the driver clicks the REAL Decline button.
#           Terminal `declined`; BOTH inventory tables Δ=0 EXACT; no browser.*
#           frame ever flows on the scan run (browser_activity expect=absent);
#           keystone clean. No cost_and_time anchor — the decline path is
#           zero-LLM by construction (extraction never starts), mirroring the
#           intake decline case's anchor set.

[meta]
id = "inventory_site_scan_ui_decline"
archetype = "A"
skills = ["search_profile_intake", "dealer_geosearch", "inventory_site_scan"]
risk_group = "E"

[narrative]
session_origin = "fresh_unpinned"
input_mode = "slash"
provider = "deepseek"
lane = "ui"

[narrative.profile]
make = "Hyundai"
model = "Tucson Hybrid"
year = 2026
location_query = "Irvine, CA 92614"
follow_up_email = "livetest@example.com"
financing_preference = "finance"
trim = "Limited"
search_radius_miles = 120
budget_max = 0
follow_up_phone = "949-555-0100"
phone_policy = "fake"
preferred_exterior_colors_json = null
preferred_interior_colors_json = null
acceptable_trims_json = null
feature_preferences_json = null
trade_in_description = null
military_first_responder = 0
current_brand_owner = 0

# ---- step 1: intake (the journey root) --------------------------------------

[[steps]]
id = "intake_create"
skill = "search_profile_intake"
purpose = "Create the Tucson profile through the real dashboard."
gate_policy = "approve_safe"
launch = "chat_slash"

[[steps.resume]]
on = "data_collection"
action = "accept"
content_from = "narrative.profile"

[[steps.anchors]]
kind = "run_status"
expect = ["done"]

[[steps.anchors]]
kind = "driver_kind"
expect = "deepseek_apikey"

[[steps.anchors]]
kind = "table_min_rows"
table = "search_profiles"
scope = "profile"
delta_min = 1

[[steps.anchors]]
kind = "no_external_mutation"

[[steps.anchors]]
kind = "cost_and_time"

[[steps.anchors]]
kind = "malformed_tool_call"
expect = "absent"

# ---- step 2: dealer_geosearch (the batch card needs discovered dealers) ------

[[steps]]
id = "geosearch_run"
skill = "dealer_geosearch"
purpose = "Discover dealers so the scan's batch card has rows to decline."
gate_policy = "approve_safe"
launch = "chat_slash"

[[steps.anchors]]
kind = "run_status"
expect = ["done"]

[[steps.anchors]]
kind = "driver_kind"
expect = "deepseek_apikey"

[[steps.anchors]]
kind = "browser_activity"

[[steps.anchors]]
kind = "table_min_rows"
table = "profile_dealers"
scope = "profile"
delta_min = 1

[[steps.anchors]]
kind = "no_external_mutation"

[[steps.anchors]]
kind = "cost_and_time"
optional = true             # zero-LLM happy path (evaluate-extract).

[[steps.anchors]]
kind = "resolution"
expect = "inferred_newest"  # unpinned session + single active profile.

[[steps.anchors]]
kind = "malformed_tool_call"
expect = "absent"

# ---- step 3: the batch card → DECLINE (terminal, zero writes, zero nav) ------

[[steps]]
id = "scan_decline"
skill = "inventory_site_scan"
purpose = "Decline at the REAL batch card — declined terminal, zero writes, zero navigation."
gate_policy = "approve_safe"
launch = "chat_slash"

[[steps.resume]]
on = "batch_review"
action = "decline"

[[steps.anchors]]
kind = "run_status"
expect = ["declined"]       # aborted{user_declined} projects to `declined`.

[[steps.anchors]]
kind = "table_min_rows"     # inventory_listings Δ=0 EXACT (decline = zero writes).
table = "inventory_listings"
scope = "profile"
delta_min = 0
exact = true

[[steps.anchors]]
kind = "table_min_rows"     # dealer_inventory_sources Δ=0 EXACT.
table = "dealer_inventory_sources"
scope = "profile"
delta_min = 0
exact = true

[[steps.anchors]]
kind = "browser_activity"
expect = "absent"           # the suspend precedes ANY Browser launch — zero nav.

[[steps.anchors]]
kind = "no_external_mutation"

[[steps.anchors]]
kind = "malformed_tool_call"
expect = "absent"
