# harness/cases/dealer_geosearch.ui_button.toml — the same dealer_geosearch
# journey, but step 2 launches from the SKILLS POPOVER RUN BUTTON: after intake
# the user opens the TopBar Skills popover and clicks the real Run button on
# the dealer_geosearch row (enabled once an active profile exists — the
# readiness-grouping projection; the popover refetches on every open). This is
# the SECOND real user surface for starting a skill. The chat-rail surfaces
# stay: slash is covered by ui_narrative; FREEFORM routing to non-intake skills
# does not exist BY DESIGN (freeform is intake-scoped — the ratified
# scope-notice behavior; there is no freeform router), so this round is
# button-not-freeform.

[meta]
id = "dealer_geosearch_ui_button"
archetype = "A"
skills = ["search_profile_intake", "dealer_geosearch"]
risk_group = "E"

[narrative]
session_origin = "fresh_unpinned"
input_mode = "slash"
provider = "deepseek"
lane = "ui"

[narrative.profile]
make = "Hyundai"
model = "Tucson Hybrid"
year = 2026
location_query = "Irvine, CA 92614"
follow_up_email = "livetest@example.com"
financing_preference = "finance"
trim = "Limited"
search_radius_miles = 120
budget_max = 0
follow_up_phone = "949-555-0100"
phone_policy = "fake"
preferred_exterior_colors_json = null
preferred_interior_colors_json = null
acceptable_trims_json = null
feature_preferences_json = null
trade_in_description = null
military_first_responder = 0
current_brand_owner = 0

# ---- step 1: intake (the journey root) --------------------------------------

[[steps]]
id = "intake_create"
skill = "search_profile_intake"
purpose = "Create the Tucson profile through the real dashboard — geosearch's input."
gate_policy = "approve_safe"
launch = "chat_slash"

[[steps.resume]]
on = "data_collection"
action = "accept"
content_from = "narrative.profile"

[[steps.resume]]
on = "intake_confirm"
action = "accept"

[[steps.anchors]]
kind = "run_status"
expect = ["done"]

[[steps.anchors]]
kind = "driver_kind"
expect = "deepseek_apikey"

[[steps.anchors]]
kind = "table_min_rows"
table = "search_profiles"
scope = "profile"
delta_min = 1

[[steps.anchors]]
kind = "no_external_mutation"

[[steps.anchors]]
kind = "cost_and_time"

# ---- step 2: dealer_geosearch from the Skills popover Run button -------------

[[steps]]
id = "geosearch_button"
skill = "dealer_geosearch"
purpose = "Launch geosearch from the Skills popover's real Run button."
gate_policy = "approve_safe"
launch = "skills_popover"

[[steps.anchors]]
kind = "run_status"
expect = ["done"]

[[steps.anchors]]
kind = "driver_kind"
expect = "deepseek_apikey"

[[steps.anchors]]
kind = "browser_activity"

[[steps.anchors]]
kind = "table_min_rows"
table = "profile_dealers"
scope = "profile"
delta_min = 1

[[steps.anchors]]
kind = "no_external_mutation"

[[steps.anchors]]
kind = "cost_and_time"
optional = true

