# harness/cases/quote_compare_cash.func.toml — FUNCTIONAL lane: the CASH
# quote-compare bucket (a CASH profile → cash quotes ranked by OTD).
#
# The twin of quote_compare.func.toml: an active CASH profile with a cash-mode
# quote. A cash buyer's quotes are OTD totals, so the ranker now puts them in a
# dedicated Cash bucket (finance + lease stay empty) — the Canvas Quote compare
# section renders the Cash bucket. (Previously the cash gate short-circuited to
# empty buckets, so a cash buyer got "Compared 0 quotes" despite having quotes —
# a real bug surfaced by the live 巡检.)
#
# A separate single-step case (not a second step of the populated case) because
# each functional case owns one server+DB and apply-fixture is additive — two
# compare worlds in one case would collide on the shared dealer/profile rows.
#
# WHY THIS ANCHOR IS MEANINGFUL: it proves a cash buyer's quotes are compared
# (the Cash bucket renders) rather than dropped. No budget number appears. Δ=0 by
# construction (a runless kind="ui" step).

[meta]
id = "quote_compare_cash_func"
archetype = "B"
skills = ["quote_compare"]
risk_group = "E"

[narrative]
session_origin = "fresh_unpinned"
input_mode = "slash"
provider = "deepseek"
lane = "ui"

[[steps]]
id = "cash_empty_panel"
kind = "ui"
fixture_state = "quote_compare_cash_world"
purpose = "A cash profile ranks its cash-mode quote in the Cash bucket (finance + lease empty) — a cash buyer's quotes are compared, not dropped."

# Open the Quotes tab — the Quote compare section lives behind it (the click
# both navigates AND waits for the Cash compare bucket to mount).
[[steps.ui_actions]]
verb = "click"
testid = "canvas-tab-quotes"

[[steps.anchors]]
kind = "dom_state"
testid = "quote-compare"
expect = "visible"

[[steps.anchors]]
kind = "dom_state"
testid = "quote-compare-cash"
expect = "visible"
