# harness/cases/dealer_reply_extract.ui_retry.func.toml — FUNCTIONAL lane: the
# AUTOMATIC same-provider malformed-class recovery of a failed
# dealer_reply_extract. fixture-mode, the harness is STUBBED so NO real model
# call ever fires — this proves the recovery FLOW end-to-end with ZERO egress.
#
# BACKGROUND (owner ruling): the auto-path's first hop runs deepseek-v4-flash
# (forced emit_result, thinking OFF). On the malformed class (#1244 — the
# deterministic serialization defect a thinking-OFF retry can't fix) the SAME run
# retries that message ONCE on deepseek-v4-pro WITH thinking (tool_choice:"auto"),
# SAME provider — privacy-clean, NO cross-provider egress and NO user button. The
# recovery is internal to a normal run, so this case just LAUNCHES the skill.
#
#   step 1 (ui)    install dealer_reply_extract_retry_world (an active Tucson
#                  profile + a bound dealer + a thread whose ONE inbound message
#                  is 'failed', a recoverable candidate). Click the dealer tile to
#                  mount the active projection. PROVE the per-thread
#                  extract-failed badge is lit (there is a failure to recover) and
#                  that NO manual retry button exists any more (the recovery is
#                  automatic — the affordance was removed).
#   step 2 (skill) launch=chat_slash → a normal dealer_reply_extract run. The
#                  stubbed harness (standing in for BOTH same-provider DeepSeek
#                  hops) recovers the failed message → +1 dealer_quotes row,
#                  profile-scoped. no_external_mutation on the step; run done.
#   step 3 (ui)    reload → the message recovered to 'succeeded', so the
#                  extract-failed badge is GONE — the recovery is durable.
#
# WHY THESE ANCHORS ARE MEANINGFUL: the absent retry button proves the manual
# Anthropic affordance is gone (recovery is automatic + same-provider). The
# dealer_quotes Δ>=1 proves the run reached real persist (the flow works).
# no_external_mutation proves the recovery stays inside the gate. The badge
# clearing proves the failed message genuinely recovered. No budget number appears
# anywhere; the stub stands in for DeepSeek so there is ZERO real egress.

[meta]
id = "dealer_reply_extract_ui_retry_func"
archetype = "B"
skills = ["dealer_reply_extract"]
risk_group = "E"

[narrative]
session_origin = "fresh_unpinned"
input_mode = "slash"
provider = "deepseek"
lane = "ui"

# ---- step 1: the failed-extraction after-state — badge lit, NO manual button ----

[[steps]]
id = "failed_extraction_state"
kind = "ui"
fixture_state = "dealer_reply_extract_retry_world"
purpose = "A failed extraction lights the per-thread extract-failed badge; the manual retry button is GONE (recovery is automatic + same-provider, not a user affordance)."

# Open the Replies tab — the Negotiations board renders the per-dealer
# extract-failed badge on its card (the click both navigates AND waits for the
# board to mount).
[[steps.ui_actions]]
verb = "click"
testid = "canvas-tab-replies"

# The per-thread extract-failed badge is lit (there is a failure to recover).
[[steps.anchors]]
kind = "dom_state"
testid = "message-extract-failed-badge"
expect = "visible"

# The manual retry button is GONE — the recovery is an automatic in-run hop now.
[[steps.anchors]]
kind = "dom_state"
testid = "retry-failed-extractions"
expect = "absent"

# The old no-key Settings hint is GONE too (the whole affordance was removed).
[[steps.anchors]]
kind = "dom_state"
testid = "retry-failed-extractions-hint"
expect = "absent"

# ---- step 2: a normal dealer_reply_extract run recovers the failed message -------

[[steps]]
id = "auto_recover_run"
skill = "dealer_reply_extract"
purpose = "A normal dealer_reply_extract run recovers the failed message (the stub stands in for both same-provider DeepSeek hops) → +1 dealer_quotes, no external mutation, run done."
gate_policy = "approve_safe"
launch = "chat_slash"

[[steps.anchors]]
kind = "run_status"
expect = ["done"]

# The recovered message wrote one raw dealer_quotes row, profile-scoped.
[[steps.anchors]]
kind = "table_min_rows"
table = "dealer_quotes"
scope = "profile"
delta_min = 1

# The recovery stays inside the gate — no submitted lead, no real send.
[[steps.anchors]]
kind = "no_external_mutation"

# ---- step 3: the recovery is durable — badge gone after reload -------------------

[[steps]]
id = "recovered_durable"
kind = "ui"
purpose = "The failed message recovered to 'succeeded' — the extract-failed badge is gone (no failures left)."

[[steps.ui_actions]]
verb = "reload"
testid = "canvas-dealer-tile"

# After the reload the tab resets to overview — reopen the Replies tab (the
# Threads section, where the badge WOULD render) before the absence anchor below.
[[steps.ui_actions]]
verb = "click"
testid = "canvas-tab-replies"

# The badge cleared — the message is no longer 'failed'.
[[steps.anchors]]
kind = "dom_state"
testid = "message-extract-failed-badge"
expect = "absent"
