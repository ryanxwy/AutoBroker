# harness/cases/dealer_reply_extract.ui_retry.func.toml — FUNCTIONAL lane: the
# MANUAL cross-provider RETRY of a failed dealer_reply_extract (the F1 privacy-
# conservative escape hatch). fixture-mode, the harness is STUBBED so NO real
# Anthropic call ever fires — this proves the FLOW end-to-end with ZERO egress.
#
# BACKGROUND: the auto-path (DeepSeek, temp:0, fail-closed) left one inbound
# dealer reply with quote_extraction_status='failed' (a deterministic
# serialization defect a same-provider retry can't fix). The owner's ruling is NO
# auto-egress: the auto-path stays DeepSeek-only/fail-closed, and recovery is a
# MANUAL, user-triggered, key-guarded, DISCLOSED retry on a different provider.
#
#   step 1 (ui)    install dealer_reply_extract_retry_world (an active Tucson
#                  profile + a bound dealer + a thread whose ONE inbound message
#                  is 'failed', a recoverable candidate; the Anthropic key set
#                  present). Click the dealer tile to mount the active projection.
#                  PROVE the key-gated affordance: the "Retry failed
#                  extractions" button renders AND its label DISCLOSES the egress
#                  provider (text contains "Anthropic"); the per-thread
#                  extract-failed badge is lit.
#   step 2 (skill) launch=canvas_button → click that retry button → the host POSTs
#                  dealer_reply_extract with escalate:true (the ONLY caller that
#                  sets escalate). The stubbed harness (standing in for Anthropic)
#                  recovers the failed message → +1 dealer_quotes row,
#                  profile-scoped. no_external_mutation on the step; run done.
#   step 3 (ui)    reload → the message recovered to 'succeeded', so the
#                  extract-failed badge is GONE and the retry button is GONE (no
#                  failures left to recover) — the recovery is durable.
#
# WHY THESE ANCHORS ARE MEANINGFUL: the disclosing button proves the key-guarded,
# privacy-DISCLOSED affordance (absent the key it would be a Settings hint). The
# dealer_quotes Δ>=1 proves the escalate:true run reached real persist (the flow
# works). no_external_mutation proves the retry stays inside the gate. The badge
# clearing proves the failed message genuinely recovered. No budget number appears
# anywhere; the stub stands in for Anthropic so there is ZERO real egress.

[meta]
id = "dealer_reply_extract_ui_retry_func"
archetype = "B"
skills = ["dealer_reply_extract"]
risk_group = "E"

[narrative]
session_origin = "fresh_unpinned"
input_mode = "slash"
provider = "deepseek"
lane = "ui"

# ---- step 1: the key-guarded, provider-DISCLOSING retry affordance renders ------

[[steps]]
id = "retry_affordance_renders"
kind = "ui"
fixture_state = "dealer_reply_extract_retry_world"
purpose = "With a failed extraction AND the Anthropic key present, the Threads section renders the active 'Retry failed extractions' button DISCLOSING the egress provider, and the extract-failed badge is lit."

# Click a bound dealer tile to wait for the active projection (incl. the Threads
# section) to mount before the anchors below.
[[steps.ui_actions]]
verb = "click"
testid = "canvas-dealer-tile"

# The retry button renders (the key is present → the active button, not the hint).
[[steps.anchors]]
kind = "dom_state"
testid = "retry-failed-extractions"
expect = "visible"

# Its label DISCLOSES the egress provider — the privacy-conservative contract.
[[steps.anchors]]
kind = "dom_state"
testid = "retry-failed-extractions"
expect = "text"
value = "Anthropic"

# The no-key hint is NOT shown (the key IS present).
[[steps.anchors]]
kind = "dom_state"
testid = "retry-failed-extractions-hint"
expect = "absent"

# The per-thread extract-failed badge is lit (there is a failure to recover).
[[steps.anchors]]
kind = "dom_state"
testid = "message-extract-failed-badge"
expect = "visible"

# ---- step 2: click the retry button → escalate:true run → the message recovers --

[[steps]]
id = "retry_escalate_run"
skill = "dealer_reply_extract"
purpose = "Clicking the retry button launches dealer_reply_extract with escalate:true; the stubbed harness recovers the failed message → +1 dealer_quotes, no external mutation, run done."
gate_policy = "approve_safe"
launch = "canvas_button"

[steps.input_inline]
button_testid = "retry-failed-extractions"

[[steps.anchors]]
kind = "run_status"
expect = ["done"]

# The recovered message wrote one raw dealer_quotes row, profile-scoped.
[[steps.anchors]]
kind = "table_min_rows"
table = "dealer_quotes"
scope = "profile"
delta_min = 1

# The retry stays inside the gate — no submitted lead, no real send.
[[steps.anchors]]
kind = "no_external_mutation"

# ---- step 3: the recovery is durable — badge + button gone after reload ----------

[[steps]]
id = "retry_recovered"
kind = "ui"
purpose = "The failed message recovered to 'succeeded' — the extract-failed badge and the retry button are both gone (no failures left to recover)."

[[steps.ui_actions]]
verb = "reload"
testid = "canvas-dealer-tile"

[[steps.ui_actions]]
verb = "click"
testid = "canvas-dealer-tile"

# The badge cleared — the message is no longer 'failed'.
[[steps.anchors]]
kind = "dom_state"
testid = "message-extract-failed-badge"
expect = "absent"

# The retry button is gone — there are no failed extractions left to retry.
[[steps.anchors]]
kind = "dom_state"
testid = "retry-failed-extractions"
expect = "absent"
