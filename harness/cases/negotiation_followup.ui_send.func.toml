# negotiation_followup.ui_send.func.toml — the X2 fake-send HAPPY PATH, FUNCTIONAL
# lane (pnpm ui:functional, AUTOBROKER_BLOCK_EXTERNAL_MUTATIONS=1, NO live LLM).
# Approving ONE thread at the batch_review card runs the gated send (L1-fuse-
# blocked under BLOCK=1 → ZERO messages rows) and then the confirm step's LOCAL
# threads.state='negotiating' write on the sent thread. The keystone stays clean:
# the fuse blocks the draft insert BEFORE any row is written, so NO fake-outbound
# row exists (no allow_fake_outbound flag needed — confirmed: X2 writes no
# submission row, only a messages draft the fuse prevents).
#
#   step 1  install followup_ready + pin the profile (pin_required).
#   step 2  "/negotiation_followup" → the batch_review card renders both drafts;
#           the driver APPROVES Jim Click Hyundai (the "SEND 1") and SKIPS Tucson
#           Kia, then submits. The gated send hits the armed fuse → {blocked} →
#           ZERO messages rows; the confirm step writes threads.state='negotiating'
#           on the sent thread and returns the `sent` outcome (resolution=pinned).
#           Terminal `done`; messages Δ=0 EXACT; resolution=pinned (the SENT-path
#           proof — a decline carries NO resolution); keystone clean; no malformed
#           tool call.
#
# WHY resolution=pinned IS the meaningful local-write anchor: threads.state→
# 'negotiating' is an UPDATE (not an INSERT), so table_min_rows (a row-count
# check) can't read it and would pass on a decline too. The `sent` confirm
# outcome sets resolution="pinned"; a `declined` outcome carries NO resolution.
# So resolution=pinned cleanly proves the SEND path ran (the path that drives the
# state write), distinguishing this from the decline twin. The promoted body's
# no-budget / no-competing-name red lines are asserted OFFLINE in
# negotiationFollowup.test.ts (under BLOCK=1 there is NO sent messages row to read
# the body from in the func lane — the fuse blocks the draft insert).

[meta]
id = "negotiation_followup_ui_send"
archetype = "A"
skills = ["negotiation_followup"]
risk_group = "E"

[narrative]
session_origin = "fresh_unpinned"
input_mode = "slash"
provider = "deepseek"
lane = "ui"

# ---- step 1: install the fixture world + pin the profile ---------------------

[[steps]]
id = "seed_and_pin"
kind = "ui"
fixture_state = "followup_ready"
purpose = "Seed the ready-to-follow-up world and pin the active search (pin_required)."
pin_label = "2026 Hyundai Tucson Hybrid Limited"

[[steps.anchors]]
kind = "dom_state"
testid = "topbar-searches"
expect = "visible"

# ---- step 2: approve ONE thread → fake send + the local state write ----------

[[steps]]
id = "followup_send"
skill = "negotiation_followup"
purpose = "Approve one thread at the REAL batch card — fake send (fuse-blocked, zero messages) + the local negotiating write."
gate_policy = "deny_all"
launch = "chat_slash"

[[steps.resume]]
on = "batch_review"
action = "approve"
default_decision = "skip"
[[steps.resume.rows]]
match = "Jim Click Hyundai"
decision = "approve"
[[steps.resume.rows]]
match = "Tucson Kia"
decision = "skip"

[[steps.anchors]]
kind = "run_status"
expect = ["done"]

[[steps.anchors]]
kind = "approval_gate"      # the batch card rendered.

[[steps.anchors]]
kind = "table_min_rows"     # zero Gmail sends — the L1 fuse blocked the draft insert.
table = "messages"
scope = "profile"
delta_min = 0
exact = true

[[steps.anchors]]
kind = "resolution"         # the SENT-path proof (the `sent` confirm sets pinned;
expect = "pinned"           # a decline carries NO resolution) — the local-write anchor.

[[steps.anchors]]
kind = "no_external_mutation"   # the fuse blocked the draft insert → no row → keystone clean.

[[steps.anchors]]
kind = "malformed_tool_call"
expect = "absent"
