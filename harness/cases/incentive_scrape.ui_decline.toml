# harness/cases/incentive_scrape.ui_decline.toml — the first-encounter
# DECLINE twin, UI-LANE, ONE browser session end-to-end. The approval card
# suspends BEFORE any navigation, so this case is safe to run live/unattended:
# the decline must be terminal with ZERO incentive writes, ZERO browser
# navigation on the scrape runs, and NO registry entry — the registry
# non-write is proven BEHAVIORALLY by the second scrape run still asking
# (approval_gate present again), never by a file anchor.
#
#   step 1  intake via chat-rail SLASH (the corpus Tucson profile).
#   step 2  "/incentive_scrape" via slash → the first-encounter approval card
#           renders on the gate-banner track → the driver clicks the REAL
#           Deny button. Terminal `declined`; the incentive slice Δ=0 EXACT;
#           no browser.* frame ever flows. No cost_and_time anchor — the
#           decline path is zero-LLM by construction.
#   step 3  "/incentive_scrape" again, SAME world → the card STILL renders
#           (nothing was remembered — the behavioral no-registry proof) →
#           Deny again; same zero-everything assertions.
#
# No [[seed.*]] sections and no geosearch step (targets derive from the
# profile; no bound dealers = no rooftop secondary surface). Zero site
# contact across the whole case beyond the dashboard itself.

[meta]
id = "incentive_scrape_ui_decline"
archetype = "A"
skills = ["search_profile_intake", "incentive_scrape"]
risk_group = "E"

[narrative]
session_origin = "fresh_unpinned"
input_mode = "slash"
provider = "deepseek"
lane = "ui"

[narrative.profile]
make = "Hyundai"
model = "Tucson Hybrid"
year = 2026
location_query = "Irvine, CA 92614"
follow_up_email = "livetest@example.com"
financing_preference = "finance"
trim = "Limited"
search_radius_miles = 120
budget_max = 0
follow_up_phone = "949-555-0100"
phone_policy = "fake"
preferred_exterior_colors_json = null
preferred_interior_colors_json = null
acceptable_trims_json = null
feature_preferences_json = null
trade_in_description = null
military_first_responder = 0
current_brand_owner = 0

# ---- step 1: intake (the journey root) --------------------------------------

[[steps]]
id = "intake_create"
skill = "search_profile_intake"
purpose = "Create the Tucson profile through the real dashboard."
gate_policy = "approve_safe"
launch = "chat_slash"

[[steps.resume]]
on = "data_collection"
action = "accept"
content_from = "narrative.profile"

[[steps.anchors]]
kind = "run_status"
expect = ["done"]

[[steps.anchors]]
kind = "driver_kind"
expect = "deepseek_apikey"

[[steps.anchors]]
kind = "table_min_rows"
table = "search_profiles"
scope = "profile"
delta_min = 1

[[steps.anchors]]
kind = "no_external_mutation"

[[steps.anchors]]
kind = "cost_and_time"

[[steps.anchors]]
kind = "malformed_tool_call"
expect = "absent"

# ---- step 2: the first-encounter card → DECLINE (terminal, zero everything) -

[[steps]]
id = "scrape_decline"
skill = "incentive_scrape"
purpose = "Decline at the REAL first-encounter approval — declined terminal, zero writes, zero navigation."
gate_policy = "approve_safe"
launch = "chat_slash"

[[steps.resume]]
on = "oem_first_encounter"
action = "decline"

[[steps.anchors]]
kind = "run_status"
expect = ["declined"]       # aborted{user_declined} projects to `declined`.

[[steps.anchors]]
kind = "driver_kind"
expect = "deepseek_apikey"

[[steps.anchors]]
kind = "approval_gate"      # the gate DID render — the decline answered it.

[[steps.anchors]]
kind = "browser_activity"   # the suspend precedes ANY navigation — zero nav.
expect = "absent"

[[steps.anchors]]
kind = "table_min_rows"     # the incentive slice Δ=0 EXACT (decline = zero writes).
table = "manufacturer_incentives"
scope = "profile"
delta_min = 0
exact = true

[[steps.anchors]]
kind = "no_external_mutation"

[[steps.anchors]]
kind = "malformed_tool_call"
expect = "absent"

# ---- step 3: re-run — the card STILL asks (the behavioral no-registry proof) -

[[steps]]
id = "scrape_decline_again"
skill = "incentive_scrape"
purpose = "Re-run after the decline: the approval asks AGAIN — nothing was remembered, no registry entry exists."
gate_policy = "approve_safe"
launch = "chat_slash"

[[steps.resume]]
on = "oem_first_encounter"
action = "decline"

[[steps.anchors]]
kind = "run_status"
expect = ["declined"]

[[steps.anchors]]
kind = "driver_kind"
expect = "deepseek_apikey"

[[steps.anchors]]
kind = "approval_gate"      # STILL asks — the declined run wrote NO registry
                            # entry (the behavioral file-non-write proof).

[[steps.anchors]]
kind = "browser_activity"
expect = "absent"

[[steps.anchors]]
kind = "table_min_rows"
table = "manufacturer_incentives"
scope = "profile"
delta_min = 0
exact = true

[[steps.anchors]]
kind = "no_external_mutation"

[[steps.anchors]]
kind = "malformed_tool_call"
expect = "absent"
