# harness/cases/search_profile_intake.ui_freeform.toml — the freeform case
# re-expressed UI-LANE: the user TYPES the prose into the real chat input; the
# prefill step extracts a seed (live DeepSeek) and the form must render VISIBLY
# SEEDED — the driver records a form_seeded ui_check asserting at least one
# field carries a prefilled value (presence-of-any-seed, never exact values —
# the prefill output is LLM-nondeterministic). The human-confirm fill + submit
# then go through the real widgets/buttons. Same anchors as the API twin.

[meta]
id = "search_profile_intake_ui_freeform"
archetype = "B"
skills = ["search_profile_intake"]
risk_group = "E"

[narrative]
session_origin = "fresh_unpinned"
input_mode = "freeform"
provider = "deepseek"
lane = "ui"

[narrative.profile]
make = "Hyundai"
model = "Tucson Hybrid"
year = 2026
location_query = "Irvine, CA 92614"
follow_up_email = "livetest@example.com"
financing_preference = "finance"
trim = "Limited"
search_radius_miles = 120
budget_max = 0
follow_up_phone = "949-555-0100"
phone_policy = "fake"
preferred_exterior_colors_json = null
preferred_interior_colors_json = null
acceptable_trims_json = null
feature_preferences_json = null
trade_in_description = null
military_first_responder = 0
current_brand_owner = 0

[[steps]]
id = "intake_freeform"
skill = "search_profile_intake"
purpose = "Freeform prose typed into the real chat input; seeded form human-confirmed."
gate_policy = "approve_safe"
launch = "chat_freeform"

[steps.input_inline]
prompt = "I want to buy a 2026 Hyundai Tucson Hybrid Limited in Irvine, CA within 120 miles, use a fake phone number for now."

[[steps.resume]]
on = "data_collection"
action = "accept"
content_from = "narrative.profile"   # human-confirmed final values over the seed.

[[steps.resume]]
on = "intake_confirm"
action = "accept"

[[steps.anchors]]
kind = "run_status"
expect = ["done"]

[[steps.anchors]]
kind = "driver_kind"
expect = "deepseek_apikey"

[[steps.anchors]]
kind = "table_min_rows"
table = "search_profiles"
scope = "profile"
delta_min = 1

[[steps.anchors]]
kind = "no_external_mutation"

[[steps.anchors]]
kind = "cost_and_time"

[[steps.anchors]]
kind = "malformed_tool_call"
expect = "absent"
