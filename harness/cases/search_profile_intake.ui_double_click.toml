# harness/cases/search_profile_intake.ui_double_click.toml — ROTATION-POOL EDGE
# (double_click_submit): the impatient user DOUBLE-CLICKS "Submit intake".
# Two assertions carry the case:
#   - ui_check (driver-recorded): the submit button DISABLES after the first
#     click, so the second click of the pair never fires a second decision.
#   - table anchor (global + exact): EXACTLY ONE search_profiles row exists on
#     the fresh throwaway DB after the run — a duplicate submit would create a
#     SECOND profile with a different id, which a profile-scoped delta could
#     never see; the global-exact form pins "one row, not two".
# Rotation pool only — NOT in harness/regression-corpus.txt.

[meta]
id = "search_profile_intake_ui_double_click"
archetype = "B"
skills = ["search_profile_intake"]
risk_group = "E"

[narrative]
session_origin = "fresh_unpinned"
input_mode = "slash"
provider = "deepseek"
lane = "ui"

[narrative.profile]
make = "Hyundai"
model = "Tucson Hybrid"
year = 2026
location_query = "Irvine, CA 92614"
follow_up_email = "livetest@example.com"
financing_preference = "finance"
trim = "Limited"
search_radius_miles = 120
budget_max = 0
follow_up_phone = "949-555-0100"
phone_policy = "fake"
preferred_exterior_colors_json = null
preferred_interior_colors_json = null
acceptable_trims_json = null
feature_preferences_json = null
trade_in_description = null
military_first_responder = 0
current_brand_owner = 0

[[steps]]
id = "intake_double_click"
skill = "search_profile_intake"
purpose = "Create the Tucson profile with a double-clicked submit (exactly one row may land)."
gate_policy = "approve_safe"
launch = "chat_slash"
edge = "double_click_submit"

[[steps.resume]]
on = "data_collection"
action = "accept"
content_from = "narrative.profile"

[[steps.anchors]]
kind = "run_status"
expect = ["done"]

[[steps.anchors]]
kind = "driver_kind"
expect = "deepseek_apikey"

[[steps.anchors]]
kind = "table_min_rows"        # the created profile landed (profile-scoped).
table = "search_profiles"
scope = "profile"
delta_min = 1
exact = true

[[steps.anchors]]
kind = "table_min_rows"        # the double-click guard: ONE row TOTAL, not two.
table = "search_profiles"
scope = "global"
min = 1
exact = true

[[steps.anchors]]
kind = "table_min_rows"
table = "audit_log"
scope = "profile"
action = "search_profile_intake"
delta_min = 1

[[steps.anchors]]
kind = "no_external_mutation"   # keystone, tolerance 0.

[[steps.anchors]]
kind = "cost_and_time"

[[steps.anchors]]
kind = "malformed_tool_call"
expect = "absent"
