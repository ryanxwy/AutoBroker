# harness/cases/incentive_scrape.ui_first_encounter.toml — the OEM
# first-encounter approval + the behavioral no-re-ask proof, UI-LANE, ONE
# browser session end-to-end on ONE isolated world:
#
#   step 1  intake via chat-rail SLASH (the corpus Tucson profile; the
#           geocoded ZIP becomes the scrape key's zip — the intake location
#           must resolve a postal code or the scrape target fails loud).
#   step 2  "/incentive_scrape" via slash — FIRST run: the registry file is
#           empty, the brand has an in-code seed candidate (the OEM offers
#           URL), so the first-encounter APPROVAL card renders on the
#           gate-banner track BEFORE any navigation. The driver clicks the
#           REAL Approve button → the registry entry is written → the OEM
#           offers page renders in an isolated browser → offer cards extracted
#           (LLM) → cash whitelist → DELETE-then-INSERT refresh of the
#           profile's (make, model, zip) incentive slice.
#   step 3  "/incentive_scrape" again, SAME world — SECOND run: the registry
#           remembers the approval, so approval_gate expect=absent is the
#           behavioral NO-RE-ASK proof — proven independently of whether the
#           page carried cash.
#
# No [[seed.*]] sections and no geosearch step: scrape targets derive from
# the active profile itself, and with no bound dealers the rooftop secondary
# source stays structurally inactive — the run's only site contact is the OEM
# offers page.
#
# LOCALIZED-CASH SHAPE (the expected path). The seed offers URL is the brand's
# national offers page. Its whitelist-class cash (customer_cash / loyalty /
# military / conquest / lease_cash) is served against the visitor's REGION: the
# cold all-MSRP grid carries no cash until the page is localized to a ZIP. The
# capture reaches it WITHOUT leaking any user data: the read face accepts the
# page's cookie consent (raises access rate; a cookie click carries no PII) and
# types the profile's ZIP DIGITS ONLY into the page's OWN location/ZIP picker
# (the page then makes its own region XHR — sidestepping the single-parameter
# SSRF rule entirely, since the skill never constructs a two-param URL). The ZIP
# field on the national offers page is a collapsed picker, so the localizer
# force-fills it (voiced) — and the localized "Featured Cash" module renders in
# the SAME cold, isolated, headless channel:chromium surface the harness drives.
#   - step 2's profile-scoped Δ>=1 manufacturer_incentives anchor is the TRUE
#     expected GREEN: the localized page serves cash, the whitelist keeps it,
#     and the (make,model,zip) slice gains rows. The table_min_rows waiver
#     (auto-derived from the deterministic confirm summary "N scraped, 0
#     incentive(s) saved", no failed/blocked brand, browser activity present)
#     is now the GENUINE-EMPTY FALLBACK ONLY — it fires only if a future run
#     truly finds zero whitelist cash, never as the expected path. A
#     blocked/failed scrape is NOT waivable — it surfaces RED.
#   - step 3 proves NO-RE-ASK (approval_gate absent). When step 2 wrote rows, a
#     fresh same-URL scrape replaces them in place (Δ=0 EXACT, browser activity
#     present — no 7-day cache marker skip is asserted here). The no-re-ask
#     proof is the load-bearing behavior and holds regardless of cash volume.

[meta]
id = "incentive_scrape_ui_first_encounter"
archetype = "A"
skills = ["search_profile_intake", "incentive_scrape"]
risk_group = "E"

[narrative]
session_origin = "fresh_unpinned"
input_mode = "slash"
provider = "deepseek"
lane = "ui"

[narrative.profile]
make = "Hyundai"
model = "Tucson Hybrid"
year = 2026
location_query = "Irvine, CA 92614"
follow_up_email = "livetest@example.com"
financing_preference = "finance"
trim = "Limited"
search_radius_miles = 120
budget_max = 0
follow_up_phone = "949-555-0100"
phone_policy = "fake"
preferred_exterior_colors_json = null
preferred_interior_colors_json = null
acceptable_trims_json = null
feature_preferences_json = null
trade_in_description = null
military_first_responder = 0
current_brand_owner = 0

# ---- step 1: intake (the journey root) --------------------------------------

[[steps]]
id = "intake_create"
skill = "search_profile_intake"
purpose = "Create the Tucson profile through the real dashboard — its make/model/zip is the scrape key."
gate_policy = "approve_safe"
launch = "chat_slash"

[[steps.resume]]
on = "data_collection"
action = "accept"
content_from = "narrative.profile"

[[steps.anchors]]
kind = "run_status"
expect = ["done"]

[[steps.anchors]]
kind = "driver_kind"
expect = "deepseek_apikey"

[[steps.anchors]]
kind = "table_min_rows"
table = "search_profiles"
scope = "profile"
delta_min = 1

[[steps.anchors]]
kind = "no_external_mutation"

[[steps.anchors]]
kind = "cost_and_time"

[[steps.anchors]]
kind = "malformed_tool_call"
expect = "absent"

# ---- step 2: first run — the first-encounter approval fires, Approve --------

[[steps]]
id = "scrape_first"
skill = "incentive_scrape"
purpose = "First encounter: approval card fires BEFORE any navigation; Approve writes the registry; the OEM page is scraped."
gate_policy = "approve_safe"
launch = "chat_slash"
max_seconds = 1200          # PER-STEP budget: one OEM page render + extraction.

[[steps.resume]]
on = "oem_first_encounter"
action = "accept"           # the REAL Approve button → approve the shown candidate.

[[steps.anchors]]
kind = "run_status"
expect = ["done"]

[[steps.anchors]]
kind = "driver_kind"
expect = "deepseek_apikey"

[[steps.anchors]]
kind = "approval_gate"      # the first-encounter gate RENDERED on this run.

[[steps.anchors]]
kind = "browser_activity"   # the approved scrape really navigated.

[[steps.anchors]]
kind = "table_min_rows"     # the profile's (make,model,zip) incentive slice
table = "manufacturer_incentives"
scope = "profile"           # gained rows this run (the join-scoped delta).
delta_min = 1

[[steps.anchors]]
kind = "no_external_mutation"

[[steps.anchors]]
kind = "cost_and_time"      # REQUIRED — extraction is an LLM phase.

[[steps.anchors]]
kind = "malformed_tool_call"
expect = "absent"

# ---- step 3: second run — registry remembers (NO re-ask) --------------------

[[steps]]
id = "scrape_no_ask"
skill = "incentive_scrape"
purpose = "Second run, same brand: NO approval gate (registry hit). A fresh same-URL scrape replaces the slice in place, so the profile-scoped delta is Δ=0 EXACT (browser activity present)."
gate_policy = "approve_safe"
launch = "chat_slash"

[[steps.anchors]]
kind = "run_status"
expect = ["done"]

[[steps.anchors]]
kind = "driver_kind"
expect = "deepseek_apikey"

[[steps.anchors]]
kind = "approval_gate"      # the behavioral no-re-ask proof: the registry
expect = "absent"           # entry from step 2 means NO gate fires here.

[[steps.anchors]]
kind = "table_min_rows"     # the slice nets Δ=0 EXACT this run: step 2 wrote the
table = "manufacturer_incentives"   # localized cash rows and a fresh same-URL scrape
scope = "profile"           # replaces them in place (delete-then-insert), so the
delta_min = 0               # profile-scoped count is unchanged. (A genuinely empty
exact = true                # world also nets Δ=0 — the anchor holds either way.)

[[steps.anchors]]
kind = "no_external_mutation"

[[steps.anchors]]
kind = "malformed_tool_call"
expect = "absent"
