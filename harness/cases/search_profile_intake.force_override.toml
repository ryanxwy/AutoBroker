# harness/cases/search_profile_intake.force_override.toml — case E (force-override).
# A FABRICATED trim that the live trim_verify should reject as invalid → the
# forceOverrideGate suspends → the user force_overrides (audited) → run completes.
#
# The resume script is two-phase by SUSPEND KIND: first answer the data_collection
# form (submit the profile with the bogus trim), then answer the force_override
# suspend with action="force_override" + a reason. The audited path writes an
# 'intake_verification_forced' audit row IMMEDIATELY. The
# approval_gate anchor proves the gate rendered (awaiting_user before prose).
#
# NOTE (live nondeterminism): the gate only fires if the live LLM rejects the trim.
# "Hypersport ZX9000" is a deliberately non-existent Tucson trim; if a model ever
# verifies it valid the gate won't fire and approval_gate/forced-audit fail RED —
# that is the honest signal, not a flake to suppress.

[meta]
id = "search_profile_intake_force_override"
archetype = "B"
skills = ["search_profile_intake"]
risk_group = "E"

[narrative]
session_origin = "fresh_unpinned"
input_mode = "slash"
provider = "deepseek"

[narrative.profile]
make = "Hyundai"
model = "Tucson Hybrid"
year = 2026
location_query = "Irvine, CA 92614"
follow_up_email = "livetest@example.com"
financing_preference = "finance"
trim = "Hypersport ZX9000"
search_radius_miles = 120
budget_max = 0
follow_up_phone = "949-555-0100"
phone_policy = "fake"
preferred_exterior_colors_json = null
preferred_interior_colors_json = null
acceptable_trims_json = null
feature_preferences_json = null
trade_in_description = null
military_first_responder = 0
current_brand_owner = 0

[[steps]]
id = "intake_force_override"
skill = "search_profile_intake"
purpose = "Force-override an unverified trim — prove the gate renders and the forced-audit row lands."
gate_policy = "approve_safe"

[[steps.resume]]
on = "data_collection"
action = "accept"
content_from = "narrative.profile"

[[steps.resume]]
on = "force_override"
action = "force_override"
reason = "I know this trim exists; proceed."

[[steps.anchors]]
kind = "run_status"
expect = ["done"]

[[steps.anchors]]
kind = "approval_gate"

[[steps.anchors]]
kind = "table_min_rows"
table = "audit_log"
scope = "global"                          # forced-audit row has search_profile_id=NULL → count unscoped by action.
action = "intake_verification_forced"
delta_min = 1

[[steps.anchors]]
kind = "no_external_mutation"

[[steps.anchors]]
kind = "cost_and_time"
