# search_profile_intake.malformed_1244.func.toml
#
# #1244 fail-closed, CI-GATED (func lane). intake's fail-closed LLM surface is the
# FREEFORM prefill (intake_freeform_prefill): the intake_malformed fixture
# (scenario.llmMalformed=true → the harnessGenerate stub returns a
# malformed_tool_call HarnessSuspend on the prefill call) forces the failure. The
# intake workflow maps that to a run-level malformed_tool_call suspend BEFORE the
# collect form; the user DECLINES, and the run must end `declined` with ZERO
# search_profiles writes (never a fabricated profile). This is the deterministic
# twin of a real DeepSeek malformed/text-dumped tool call — no live DeepSeek and no
# SUT fault-injection route needed (the func lane already injects the stub).
#
# (The slash launch has no LLM step, so the #1244 surface is the FREEFORM prefill —
# the trim-suggestion lookup is a non-authoritative helper that degrades, never
# gates, so it cannot carry a fail-closed case.)

[meta]
id = "search_profile_intake_malformed_1244"
archetype = "B"
skills = ["search_profile_intake"]
risk_group = "E"

[narrative]
session_origin = "fresh_unpinned"
input_mode = "freeform"
provider = "deepseek"

[[steps]]
id = "intake_malformed_1244"
skill = "search_profile_intake"
fixture_state = "intake_malformed"
purpose = "#1244 fail-closed: malformed freeform prefill -> decline -> declined, zero writes."
gate_policy = "approve_safe"

[steps.input_inline]
prompt = "I want a 2026 Hyundai Tucson Hybrid Limited in Irvine, CA within 120 miles."

# The stubbed prefill fail-closes -> malformed_tool_call suspend (before collect).
# DECLINE it. prefill is a SEED helper, so a decline ABANDONS the auto-fill and
# proceeds to the EMPTY collect form (it never fabricates a seed) — declining the
# form then ends the run zero-write.
[[steps.resume]]
on = "malformed_tool_call"
action = "decline"

[[steps.resume]]
on = "data_collection"
action = "decline"

[[steps.anchors]]
kind = "malformed_tool_call"
expect = "fail_closed"

[[steps.anchors]]
kind = "no_external_mutation"

[[steps.anchors]]
kind = "run_status"
expect = ["declined", "error"]

[[steps.anchors]]
kind = "table_min_rows"
table = "search_profiles"
scope = "global"
exact = true
min = 0
