# harness/cases/dealer_geosearch.ui_narrative.toml — the dealer_geosearch
# non-tech-user journey, UI-LANE, in ONE server session + ONE browser session:
#   step 1  intake via chat-rail SLASH (the corpus Tucson profile — geosearch
#           needs make + resolved coords + radius on an ACTIVE profile).
#   step 2  "/dealer_geosearch" typed into the same chat rail, NO args — the
#           workflow's three-branch resolver picks the just-created profile as
#           the single active one. The run browses REAL Google Maps read-only
#           through the product's own browser service (politeness built in) and
#           upserts dealers + profile_dealers rows locally.
#
# cost_and_time is `optional` on step 2: the happy path is ZERO-LLM by design
# (page.evaluate extraction; the single LLM call exists only on the
# snapshot-fallback branch), so an empty ledger is the valid recorded outcome.
# EMPTY-RESULT WAIVER: if Maps really yields zero candidates in radius, the
# runner records a table_min_rows waiver (browser activity must be present AND
# zero failed/blocked viewports — a zero with failures is a RED, not a waiver) —
# see geosearchEmptyResultWaiver in runner.ts.
#
# RADIUS 120: live profiles carry a 120-mile search radius. Any radius >50mi
# yields exactly 5 viewports (center/N/S/E/W at zoom 10), so this case
# exercises the full 5-viewport scan shape; expect a few dozen SoCal rooftops
# rather than the single-digit count a 25-mile radius returned.

[meta]
id = "dealer_geosearch_ui_narrative"
archetype = "A"            # browser archetype — the product browser drives Maps.
skills = ["search_profile_intake", "dealer_geosearch"]
risk_group = "E"           # read-only discovery + local-write upsert; no mutation gate.

[narrative]
session_origin = "fresh_unpinned"
input_mode = "slash"
provider = "deepseek"
lane = "ui"

[narrative.profile]
make = "Hyundai"
model = "Tucson Hybrid"
year = 2026
location_query = "Irvine, CA 92614"
follow_up_email = "livetest@example.com"
financing_preference = "finance"
trim = "Limited"
search_radius_miles = 120
budget_max = 0
follow_up_phone = "949-555-0100"
phone_policy = "fake"
preferred_exterior_colors_json = null
preferred_interior_colors_json = null
acceptable_trims_json = null
feature_preferences_json = null
trade_in_description = null
military_first_responder = 0
current_brand_owner = 0

# ---- step 1: intake (the journey root) --------------------------------------

[[steps]]
id = "intake_create"
skill = "search_profile_intake"
purpose = "Create the Tucson profile through the real dashboard — geosearch's input."
gate_policy = "approve_safe"
launch = "chat_slash"

[[steps.resume]]
on = "data_collection"
action = "accept"
content_from = "narrative.profile"

[[steps.anchors]]
kind = "run_status"
expect = ["done"]

[[steps.anchors]]
kind = "driver_kind"
expect = "deepseek_apikey"

[[steps.anchors]]
kind = "table_min_rows"
table = "search_profiles"
scope = "profile"
delta_min = 1

[[steps.anchors]]
kind = "no_external_mutation"

[[steps.anchors]]
kind = "cost_and_time"

[[steps.anchors]]
kind = "malformed_tool_call"
expect = "absent"

# ---- step 2: dealer_geosearch (slash, no args — single-active resolution) ----

[[steps]]
id = "geosearch_run"
skill = "dealer_geosearch"
purpose = "Discover dealers near the just-created profile via real Maps browsing."
gate_policy = "approve_safe"
launch = "chat_slash"

[[steps.anchors]]
kind = "run_status"
expect = ["done"]

[[steps.anchors]]
kind = "driver_kind"
expect = "deepseek_apikey"

[[steps.anchors]]
kind = "browser_activity"   # browser.* SSE frames from the product browser.

[[steps.anchors]]
kind = "table_min_rows"     # profile_dealers_present.
table = "profile_dealers"
scope = "profile"
delta_min = 1

[[steps.anchors]]
kind = "no_external_mutation"   # read-only browsing; submit physically ungated here.

[[steps.anchors]]
kind = "cost_and_time"
optional = true             # zero-LLM happy path: no ledger row is a valid outcome.

[[steps.anchors]]
kind = "malformed_tool_call"
expect = "absent"
