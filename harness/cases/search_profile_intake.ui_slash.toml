# harness/cases/search_profile_intake.ui_slash.toml — the slash case re-expressed
# UI-LANE: the simulated non-tech user TYPES "/search_profile_intake" into the real
# chat-rail textarea, the rendered 18-field form is filled through the real
# widgets, and the real "Submit intake" button is clicked. Same anchors as the
# API twin (search_profile_intake.slash.toml); the verdict's ui_checks ADD the
# real DOM checks (form-before-prose, gate-zone order, terminal summary).

[meta]
id = "search_profile_intake_ui_slash"
archetype = "B"
skills = ["search_profile_intake"]
risk_group = "E"

[narrative]
session_origin = "fresh_unpinned"
input_mode = "slash"
provider = "deepseek"
lane = "ui"

[narrative.profile]
make = "Hyundai"
model = "Tucson Hybrid"
year = 2026
location_query = "Irvine, CA 92614"
follow_up_email = "livetest@example.com"
financing_preference = "finance"
trim = "Limited"
search_radius_miles = 120
budget_max = 0
follow_up_phone = "949-555-0100"
phone_policy = "fake"
preferred_exterior_colors_json = null
preferred_interior_colors_json = null
acceptable_trims_json = null
feature_preferences_json = null
trade_in_description = null
military_first_responder = 0
current_brand_owner = 0

[[steps]]
id = "intake_create"
skill = "search_profile_intake"
purpose = "Create the Tucson profile through the REAL dashboard (chat-rail slash)."
gate_policy = "approve_safe"
launch = "chat_slash"

[[steps.resume]]
on = "data_collection"
action = "accept"
content_from = "narrative.profile"   # filled into the REAL rendered widgets.

[[steps.anchors]]
kind = "run_status"
expect = ["done"]

[[steps.anchors]]
kind = "driver_kind"
expect = "deepseek_apikey"

[[steps.anchors]]
kind = "table_min_rows"
table = "search_profiles"
scope = "profile"
delta_min = 1

[[steps.anchors]]
kind = "table_min_rows"
table = "audit_log"
scope = "profile"
action = "search_profile_intake"
delta_min = 1

[[steps.anchors]]
kind = "no_external_mutation"   # keystone, tolerance 0.

[[steps.anchors]]
kind = "cost_and_time"

[[steps.anchors]]
kind = "malformed_tool_call"
expect = "absent"
