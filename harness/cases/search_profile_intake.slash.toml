# harness/cases/search_profile_intake.slash.toml — the canonical slash case (case A).
# Round 1 of this skill's two-round harness: pure skill input via the form
# (input_mode=slash, NO prefill). The 6+1 GREEN anchor subset for intake.
#
# Form content = [narrative.profile] (the strict 18-field intake schema: the 6
# required fields + the 12 optional fields as explicit values/null). The collect
# suspend's resume submits this content; the route back-validates it against
# SearchProfileIntakeInputSchema.strict before resuming the workflow.

[meta]
id = "search_profile_intake_slash"
archetype = "B"            # Phase-1 browser cluster; intake itself drives goplaces (HTTP), not Browser #2.
skills = ["search_profile_intake"]
risk_group = "E"           # read-only cluster → approve_safe.

[narrative]
session_origin = "fresh_unpinned"   # intake creates + pins; never inherits an old pin.
input_mode = "slash"
provider = "deepseek"

# The corpus profile. budget_max is INTERNAL-ONLY — collected, never
# dealer-facing. phone_policy 'fake' by default. All 18 strict fields present.
[narrative.profile]
make = "Hyundai"
model = "Tucson Hybrid"
year = 2026
location_query = "Irvine, CA 92614"
follow_up_email = "livetest@example.com"
financing_preference = "finance"
trim = "Limited"
search_radius_miles = 120
budget_max = 0
follow_up_phone = "949-555-0100"
phone_policy = "fake"
preferred_exterior_colors_json = null
preferred_interior_colors_json = null
acceptable_trims_json = null
feature_preferences_json = null
trade_in_description = null
military_first_responder = 0
current_brand_owner = 0

[[steps]]
id = "intake_create"
skill = "search_profile_intake"
purpose = "Create and pin the Tucson profile — the narrative root."
gate_policy = "approve_safe"   # read-only cluster; intake never trips the mutation gate.

[[steps.resume]]
on = "data_collection"
action = "accept"
content_from = "narrative.profile"   # fill the form from the profile table.

[[steps.resume]]
on = "intake_confirm"
action = "accept"

[[steps.anchors]]
kind = "run_status"
expect = ["done"]

[[steps.anchors]]
kind = "driver_kind"
expect = "deepseek_apikey"

[[steps.anchors]]
kind = "table_min_rows"
table = "search_profiles"
scope = "profile"
delta_min = 1

[[steps.anchors]]
kind = "table_min_rows"
table = "audit_log"
scope = "profile"
action = "search_profile_intake"
delta_min = 1

[[steps.anchors]]
kind = "no_external_mutation"   # keystone, tolerance 0.

[[steps.anchors]]
kind = "cost_and_time"

