# harness/cases/env_settings.func.toml — FUNCTIONAL lane: the Settings →
# Environment panel, end-to-end (the centralized operational-env surface).
#
# A non-tech user opens Settings and sees the Environment card: the editable
# rows (app_mode as a select — the sole send-control variable, chrome_headless as
# a "Show browser window" toggle) and the read-only rows (the demo-status pill,
# the data-dir path). They flip the browser-window toggle and it saves.
#
# WHY THIS IS A REAL END-TO-END PROOF (beyond the RTL component tests):
#   - The panel mounts from a LIVE getEnvConfig() round-trip — the descriptor
#     rows render only because GET /api/settings/env → the envConfigStore →
#     the panel actually connected in a real browser.
#   - The toggle click drives a REAL PUT /api/settings/env to the isolated
#     server; the Saved badge renders ONLY after that PUT resolves 200, so the
#     click-as-wait on env-saved-chrome_headless is itself the save-succeeded
#     proof (a non-200 / no-fire times out RED).
#   - SAFETY ANCHOR: a read-only status row (demo_seed) renders, but it has NO
#     toggle and NO select (asserted absent) — a read-only row is structurally
#     non-editable from the UI, proven against the live DOM, not just the unit reducer.
#
# The select-driven mode->buyer confirm flow is NOT exercised here: the
# functional lane has no selectOption verb (click/fill/press/reload only); that
# branch is locked by the EnvPanel RTL tests.

[meta]
id = "env_settings_func"
archetype = "B"
skills = ["search_profile_intake"]
risk_group = "E"

[narrative]
session_origin = "fresh_unpinned"
input_mode = "slash"
provider = "deepseek"
lane = "ui"

[[steps]]
id = "env_panel_renders_and_saves"
kind = "ui"
fixture_state = "empty_home"
purpose = "Settings → Environment panel renders the curated env vars from a live getEnvConfig(); the editable app_mode (select) + chrome_headless (toggle) rows and the read-only demo-status pill + data-dir path all mount; flipping the browser-window toggle drives a real PUT proven by the Saved badge; and the read-only status row carries no editable control."

# Open Settings (DeepSeek key is seeded in fixture mode, so the SPA is not gated
# and /settings shows normally).
[[steps.ui_actions]]
verb = "click"
testid = "topbar-settings"

# Flip "Show browser window" — the click verb waits for the toggle to mount
# (so this also waits for the live getEnvConfig() panel), then triggers the real
# PUT /api/settings/env (chrome_headless -> "0").
[[steps.ui_actions]]
verb = "click"
testid = "env-toggle-chrome_headless"

# WAIT on the Saved badge: it renders ONLY after the PUT resolves 200, so this
# click-as-wait is the save-succeeded proof.
[[steps.ui_actions]]
verb = "click"
testid = "env-saved-chrome_headless"

# The Environment panel mounted.
[[steps.anchors]]
kind = "dom_state"
testid = "settings-env"
expect = "visible"

# The editable app_mode row + its keyword + its select control render.
[[steps.anchors]]
kind = "dom_state"
testid = "env-row-app_mode"
expect = "visible"

[[steps.anchors]]
kind = "dom_state"
testid = "env-keyword-app_mode"
expect = "text"
value = "AUTOBROKER_MODE"

[[steps.anchors]]
kind = "dom_state"
testid = "env-select-app_mode"
expect = "visible"

# The editable chrome_headless row + its toggle render.
[[steps.anchors]]
kind = "dom_state"
testid = "env-row-chrome_headless"
expect = "visible"

[[steps.anchors]]
kind = "dom_state"
testid = "env-toggle-chrome_headless"
expect = "visible"

# The keyword carries an accessible tooltip affordance (the InfoHint button).
[[steps.anchors]]
kind = "dom_state"
testid = "info-hint-app_mode"
expect = "visible"

# The read-only demo-status row renders...
[[steps.anchors]]
kind = "dom_state"
testid = "env-row-demo_seed"
expect = "visible"

# ...but it is structurally read-only from the UI: no toggle, no select.
[[steps.anchors]]
kind = "dom_state"
testid = "env-toggle-demo_seed"
expect = "absent"

[[steps.anchors]]
kind = "dom_state"
testid = "env-select-demo_seed"
expect = "absent"

# The read-only data-dir path renders (straight from the env response value).
[[steps.anchors]]
kind = "dom_state"
testid = "env-path-data_dir"
expect = "visible"

# The editable per_dealer_record_cap numeric row renders.
[[steps.anchors]]
kind = "dom_state"
testid = "env-row-per_dealer_record_cap"
expect = "visible"

# Its number input renders.
[[steps.anchors]]
kind = "dom_state"
testid = "env-input-per_dealer_record_cap"
expect = "visible"

[[steps.ui_actions]]
verb = "fill"
testid = "env-input-per_dealer_record_cap"
value = "30"

[[steps.ui_actions]]
verb = "click"
testid = "env-save-per_dealer_record_cap"

[[steps.ui_actions]]
verb = "click"
testid = "env-saved-per_dealer_record_cap"

[[steps.anchors]]
kind = "dom_state"
testid = "env-saved-per_dealer_record_cap"
expect = "visible"
