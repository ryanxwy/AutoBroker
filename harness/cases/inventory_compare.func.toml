# harness/cases/inventory_compare.func.toml — FUNCTIONAL lane: the deterministic
# inventory ranker rail (the POPULATED world; the empty rail is its own case,
# inventory_compare_empty.func.toml, because each functional case owns one
# server+DB and apply-fixture is additive — two listing worlds in one case would
# collide on the shared dealer/profile rows).
#
# inventory_compare is a ZERO-LLM, read-only, re-runnable skill: the
# /api/profiles/:id/inventory-compare route ranks the profile's live listings at
# read time (nothing is persisted). This case drives the Canvas Inventory
# candidates section over the populated fixture world on the offline functional
# lane (no live LLM/geocode; Δ=0 BY CONSTRUCTION — a runless kind="ui" step
# snapshots before==after with no run between, so a pure read panel reaches no
# side effect).
#
# FIXTURE COUNTS (inventoryListings fixture, authoritative):
#   5 seeded listings → 2 dropped by hard filters (ordered + over-budget)
#   = 3 surviving candidates (totalListings=3)
#   Of those 3: only lst_strong (exact trim, in_stock, score ≥ 0.6) is
#   recommended → recommendedCount=1
#
#   step 1  default Recommended view: tally shows "1 recommended of 3 listings";
#           1 candidate row visible (the Recommended filter default); full VIN
#           + stock of lst_strong shown. Count=1 proves the Recommended default.
#           The tally "1 of 3" proves both the recommendedCount and totalListings
#           from the ranker. The All-filter → count=3 switch and the
#           incomplete-badge / stock-missing assertions for the non-recommended
#           candidates are covered by the InventoryCandidates unit tests
#           (no func-lane runner primitive supports mid-step ui_action/anchor
#           interleaving). No budget number appears.
#
# WHY THESE ANCHORS ARE MEANINGFUL:
#   - tally "1 recommended of 3 listings" proves the ranker's cardinality (the
#     recommended predicate: exact/near + in_stock/in_transit + score ≥ 0.6;
#     only lst_strong qualifies; the near/SEL rows score below 0.6).
#   - count=1 proves the default filter is Recommended (not All).
#   - full VIN (17-char) + stock number of the recommended candidate prove the
#     display invariant (never tail-only VIN, never fabricated stock).
#
# The kind="skill" zero-write + STOP-card proofs belong to the LIVE UI-lane
# (chat-slash launches, not part of pnpm ui:functional) — like active_search,
# this offline functional case omits them.

[meta]
id = "inventory_compare_func"
archetype = "B"
skills = ["inventory_compare"]
risk_group = "E"

[narrative]
session_origin = "fresh_unpinned"
input_mode = "slash"
provider = "deepseek"
lane = "ui"

# ---- step 1: Recommended filter default view -----------------------------------

[[steps]]
id = "recommended_rail"
kind = "ui"
fixture_state = "inventory_listings"
purpose = "Canvas Inventory section mounts with Recommended as the default filter (recommendedCount=1>0). Tally reads '1 recommended of 3 listings'. 1 candidate row visible (lst_strong). Full VIN + stock shown."

# Open the Inventory tab — the candidates section lives behind it in the tabbed
# workbench (the click both navigates AND waits for the section to mount before
# the tally + row-count + field anchors below).
[[steps.ui_actions]]
verb = "click"
testid = "canvas-tab-inventory"

[[steps.anchors]]
kind = "dom_state"
testid = "canvas-inventory-candidates"
expect = "visible"

# The tally proves the recommended/total cardinality: 1 recommended of the 3
# surviving candidates (5 seeded - ordered - over-budget = 3 total;
# only lst_strong satisfies the three-condition recommended predicate).
[[steps.anchors]]
kind = "dom_state"
testid = "inventory-tally"
expect = "text"
value = "1 recommended of 3 listings"

# Default filter is Recommended (recommendedCount=1 > 0). Only lst_strong
# is visible. count=1 is the Recommended-default cardinality proof.
[[steps.anchors]]
kind = "dom_state"
testid = "inventory-candidate-row"
expect = "count"
count = 1
match = "exact"

# The FULL 17-char VIN of lst_strong is displayed (the listings display
# invariant). The VIN is the first-ranked recommended row's VIN.
[[steps.anchors]]
kind = "dom_state"
testid = "inventory-candidate-vin"
expect = "text"
value = "KM8JBCAE3RU000042"

# A present stock number renders verbatim (the top-ranked row's stock).
[[steps.anchors]]
kind = "dom_state"
testid = "inventory-stock"
expect = "text"
value = "STK-A1"

# The per-row trim is displayed (trim is a first-class axis, always shown). The
# recommended row is lst_strong, whose trim is the profile trim "Limited" — the
# self-labeled "trim Limited" segment carries it (substring match on the value).
[[steps.anchors]]
kind = "dom_state"
testid = "inventory-candidate-trim"
expect = "text"
value = "Limited"
