# harness/cases/dealer_reply_extract.ui_quotes.func.toml — FUNCTIONAL lane: the
# dealer_reply_extract raw "Extracted quotes" Canvas section (the Quotes tab).
#
# dealer_reply_extract WRITES dealer_quotes rows (the raw extraction output) and
# flips messages.quote_extraction_status to 'succeeded'/'failed'. This case drives
# the Canvas read projection of that after-state on the offline functional lane
# (no live LLM; Δ=0 BY CONSTRUCTION — a runless kind="ui" step snapshots
# before==after with no run between, so the pure read surfaces reach no side
# effect).
#
#   step 1  dealer_reply_extract_world → the active profile's Canvas Quotes tab
#           projects the "Extracted quotes" section (canvas-quotes) with THREE raw
#           quote rows across modes (finance + lease + CASH — the cash row is the
#           one the ranked /quote-compare finance/lease buckets would omit).
#
# WHY THESE ANCHORS ARE MEANINGFUL: canvas-quotes visibility proves the raw
# projection mounts; the row count proves every mode renders (incl. the cash
# quote the compare buckets drop). No budget number appears anywhere; the empty
# state is the twin case dealer_reply_extract.ui_quotes_empty.func.toml. The
# per-thread message-extract-failed badge (which lives behind the Replies tab —
# a different panel that can't share this step's single final DOM state) is
# proven by dealer_reply_extract.ui_retry (badge visible, then absent after the
# auto-recovery).

[meta]
id = "dealer_reply_extract_ui_quotes_func"
archetype = "B"
skills = ["dealer_reply_extract"]
risk_group = "E"

[narrative]
session_origin = "fresh_unpinned"
input_mode = "slash"
provider = "deepseek"
lane = "ui"

# In the tabbed workbench the raw "Extracted quotes" section lives behind the
# Quotes tab and the per-thread extract-failed badge behind the Replies tab — two
# different panels. Anchors score against ONE final DOM state and only the active
# tab's panel renders, so the two assertions can't coexist in one step. The
# seed inserts here are NOT idempotent (plain INSERTs), and a case may not declare
# the same fixture_state twice, so a same-world second step isn't available. This
# case therefore asserts the Quotes-tab content; the populated-world extract-
# failed badge (visible) + its clearing (absent) are proven by
# dealer_reply_extract.ui_retry over the failed-extraction world.

# ---- step 1: the populated raw-quotes section (Quotes tab) ----------------------

[[steps]]
id = "extracted_quotes_panel"
kind = "ui"
fixture_state = "dealer_reply_extract_world"
purpose = "The Canvas Extracted-quotes section (Quotes tab) renders 3 raw quote rows across modes (finance + lease + cash)."

# Open the Quotes tab — the Extracted-quotes section lives behind it (the click
# both navigates AND waits for the section to mount before the anchors below).
[[steps.ui_actions]]
verb = "click"
testid = "canvas-tab-quotes"

[[steps.anchors]]
kind = "dom_state"
testid = "canvas-quotes"
expect = "visible"

# THREE raw quote rows — every financing mode renders, including the cash quote
# the ranked compare buckets omit. Exact match (NOT prefix): the section wrapper
# carries a different testid, so an exact selector counts only the rows.
[[steps.anchors]]
kind = "dom_state"
testid = "canvas-quote-row"
expect = "count"
count = 3
match = "exact"
