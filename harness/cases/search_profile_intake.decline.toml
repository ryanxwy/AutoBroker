# harness/cases/search_profile_intake.decline.toml — case C (decline / zero write).
# The user declines/cancels at the data_collection form → terminal `declined`,
# ZERO writes (D-AI-4). Anchors: run_status=["declined"], exact delta 0 on
# search_profiles, keystone clean.

[meta]
id = "search_profile_intake_decline"
archetype = "B"
skills = ["search_profile_intake"]
risk_group = "E"

[narrative]
session_origin = "fresh_unpinned"
input_mode = "slash"
provider = "deepseek"

[[steps]]
id = "intake_decline"
skill = "search_profile_intake"
purpose = "Decline at the form — prove zero writes and a declined terminal."
gate_policy = "approve_safe"

[[steps.resume]]
on = "data_collection"
action = "decline"

[[steps.anchors]]
kind = "run_status"
expect = ["declined"]

[[steps.anchors]]
kind = "table_min_rows"
table = "search_profiles"
scope = "profile"
delta_min = 0
exact = true

[[steps.anchors]]
kind = "no_external_mutation"
