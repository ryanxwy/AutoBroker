# pnpm workspace members for the AutoBroker (TS) five-layer monorepo.
#
# Five-layer one-way dependency order (enforced by TS project references in
# tsconfig.base.json): core -> model -> workflows -> tools -> app.
#   packages/core       — pure TYPES + Zod schemas (imports no framework)
#   packages/model      — AI SDK 6 provider layer (registry, policy, resolveModel)
#   packages/workflows  — Mastra backbone + gate/fallback orchestration
#   packages/tools      — Gmail / browser / DB / calc / validators (only layer
#                         that touches product DB or external APIs)
#   packages/db         — Drizzle schema + better-sqlite3 connection
#   packages/skills     — the 17 skill definitions (built one-at-a-time by risk)
#   apps/server         — backend HTTP + SSE skill-run stream
#   apps/ui             — React/Vite + AI SDK UI chat rail
#   apps/desktop        — Electron shell (Phase 6 placeholder)
packages:
  - "packages/*"
  - "apps/*"
  # harness/ — the live-LLM harness (runner CLI, evaluator, cases, daily export).
  # A standalone workspace package (NOT in the layered src/ wall; consumes the
  # built @autobroker/* dist read-only, like the apps/ui/e2e test infra). It is
  # dependency-cruiser-isolated from better-sqlite3/drizzle/playwright/@ai-sdk.
  - "harness"
