# CI gates for the AutoBroker (TS) monorepo — Phase 0 set.
#
# Gates (each maps to a documented invariant):
#   typecheck     — TS project references encode the five-layer wall (types).
#   test          — L1 safety net: #1244 detector, L2 gate paths, Mastra trio.
#   check:strings — stale-name guard (CLAUDE.md naming ruling 2026-06-03).
#   lint:deps     — dependency-cruiser runtime-import wall (layer DAG +
#                   framework ownership; TS references alone don't police this).
#   db:check      — drizzle-kit empty-diff gate, scoped to the PRODUCT schema
#                   (mastra.db is excluded by scope, not by exception). The
#                   committed drizzle/ snapshot was generated from the
#                   corrected src/schema.ts (introspected oracle baseline +
#                   the 3 partial-index WHEREs + 12 hand-authored CHECKs).
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6 # version comes from package.json packageManager
      - uses: actions/setup-node@v6
        with:
          # Node 24 (Active LTS). engines>=24.13.0 + .npmrc engine-strict=true make a
          # Node-22 leg un-installable, so CI runs 24 only (not a [22,24] matrix).
          node-version: 24
          # Explicit pnpm cache (setup-node v6 only AUTO-caches npm; explicit is honored).
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:strings
      - run: pnpm lint:deps
      - run: pnpm db:check
